spring.application.name=abet-cv-parser-worker
spring.main.banner-mode=off

server.port=${PORT:8081}
server.tomcat.connection-timeout=5s
server.tomcat.threads.max=4
server.max-http-request-header-size=16KB

parser-worker.token=${PARSER_WORKER_TOKEN}
parser-worker.maximum-file-size-bytes=10485760
parser-worker.maximum-extracted-characters=1000000
parser-worker.maximum-pdf-main-memory-bytes=33554432
parser-worker.maximum-execution-time=30s
parser-worker.temporary-directory=/tmp/cv-parser
