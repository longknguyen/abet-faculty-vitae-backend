spring.application.name=abet-faculty-vitae-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.jdbc.initialize-schema=never

app.identity.subject-attribute=${NETBADGE_SUBJECT_ATTRIBUTE:urn:oid:0.9.2342.19200300.100.1.1}
app.identity.email-attribute=${NETBADGE_EMAIL_ATTRIBUTE:urn:oid:0.9.2342.19200300.100.1.3}
app.identity.display-name-attribute=${NETBADGE_DISPLAY_NAME_ATTRIBUTE:urn:oid:2.16.840.1.113730.3.1.241}
app.identity.surname-attribute=${NETBADGE_SURNAME_ATTRIBUTE:urn:oid:2.5.4.4}
app.identity.membership-attribute=${NETBADGE_MEMBERSHIP_ATTRIBUTE:urn:oid:1.3.6.1.4.1.5923.1.5.1.1}
app.identity.administrator-group=${NETBADGE_ADMIN_GROUP:cn=ABET-Vitae-Admin,ou=Personal,ou=Groups,o=University of Virginia,c=US}
app.identity.faculty-group=${NETBADGE_FACULTY_GROUP:cn=ABET-Vitae-Faculty,ou=Automated,ou=Groups,o=University of Virginia,c=US}

app.review-cycle-defaults.department-name=${ABET_DEPARTMENT_NAME:Computer Science}
app.review-cycle-defaults.rendering-template-name=${ABET_RENDERING_TEMPLATE:faculty-vitae}
app.review-cycle-defaults.required-sections=PROFILE,EDUCATION,EXPERIENCE,CREDENTIAL,PROFESSIONAL_DEVELOPMENT,SERVICE,PUBLICATION_PRESENTATION

logging.level.org.hibernate.orm.connections.pooling=WARN

# The backend and isolated worker independently enforce this transport limit.
app.cv-extraction.maximum-file-size-bytes=10485760

app.cv-upload.maximum-file-size-bytes=${app.cv-extraction.maximum-file-size-bytes}
app.cv-upload.retention-period=90d

# Private directory for storing uploaded CV files. Override with CV_STORAGE_DIRECTORY in production.
app.cv-storage.directory=${CV_STORAGE_DIRECTORY:./private-cv-storage}

# Selects the CV storage provider through an environment variable.
# Defaults to local storage when CV_STORAGE_PROVIDER is not set.
app.cv-storage.provider=${CV_STORAGE_PROVIDER:local}
app.cv-storage.connect-timeout=${CV_STORAGE_CONNECT_TIMEOUT:2s}
app.cv-storage.request-timeout=${CV_STORAGE_REQUEST_TIMEOUT:15s}

# Supabase Storage configuration
# Reads the Supabase project URL from the environment variable.
app.cv-storage.supabase.url=${SUPABASE_URL:}

# Reads the Supabase secret API key from the environment.
# Keep this key private and never commit it to GitHub.
app.cv-storage.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Specifies the private Supabase Storage bucket for faculty CV files.
# Uses faculty-cvs as the default if the environment variable is not set.
app.cv-storage.supabase.bucket=${SUPABASE_BUCKET:faculty-cvs}

# Disabled until the private parser worker is running. Tika is not on this application's classpath.
app.cv-extraction.worker.enabled=${CV_PARSER_WORKER_ENABLED:false}
app.cv-extraction.worker.base-url=${CV_PARSER_WORKER_URL:http://127.0.0.1:8081}
app.cv-extraction.worker.token=${PARSER_WORKER_TOKEN:}
app.cv-extraction.worker.connect-timeout=2s
app.cv-extraction.worker.request-timeout=35s
app.cv-extraction.worker.maximum-file-size-bytes=${app.cv-extraction.maximum-file-size-bytes}
app.cv-extraction.worker.maximum-response-bytes=5000000

app.malware-scanning.clamav.host=${CLAMAV_HOST:localhost}
app.malware-scanning.clamav.port=${CLAMAV_PORT:3310}
app.malware-scanning.clamav.connect-timeout-milliseconds=2000
app.malware-scanning.clamav.read-timeout-milliseconds=30000
app.malware-scanning.clamav.maximum-file-size-bytes=${app.cv-extraction.maximum-file-size-bytes}

app.cv-processing.enabled=${CV_PROCESSING_ENABLED:false}
app.cv-processing.outbox-poll-interval=1s
app.cv-processing.publisher-confirm-timeout=5s
app.cv-processing.maximum-attempts=3
app.cv-processing.initial-retry-interval=1s
app.cv-processing.retry-multiplier=2
app.cv-processing.maximum-retry-interval=10s

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:vitae}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:vitae-local-only}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
