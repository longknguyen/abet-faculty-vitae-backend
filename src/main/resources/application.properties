spring.application.name=abet-faculty-vitae-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.jdbc.initialize-schema=never

app.identity.subject-attribute=${NETBADGE_SUBJECT_ATTRIBUTE:uid}
app.identity.email-attribute=${NETBADGE_EMAIL_ATTRIBUTE:mail}
app.identity.display-name-attribute=${NETBADGE_DISPLAY_NAME_ATTRIBUTE:displayName}
app.identity.surname-attribute=${NETBADGE_SURNAME_ATTRIBUTE:sn}

logging.level.org.hibernate.orm.connections.pooling=WARN

# The backend and isolated worker independently enforce this transport limit.
app.cv-extraction.maximum-file-size-bytes=10485760

# Disabled until the private parser worker is running. Tika is not on this application's classpath.
app.cv-extraction.worker.enabled=${CV_PARSER_WORKER_ENABLED:false}
app.cv-extraction.worker.base-url=${CV_PARSER_WORKER_URL:http://127.0.0.1:8081}
app.cv-extraction.worker.token=${PARSER_WORKER_TOKEN:}
app.cv-extraction.worker.connect-timeout=2s
app.cv-extraction.worker.request-timeout=35s
app.cv-extraction.worker.maximum-file-size-bytes=${app.cv-extraction.maximum-file-size-bytes}
app.cv-extraction.worker.maximum-response-bytes=5000000

app.malware-scanning.clamav.host=${CLAMAV_HOST:localhost}
app.malware-scanning.clamav.port=${CLAMAV_PORT:3310}
app.malware-scanning.clamav.connect-timeout-milliseconds=2000
app.malware-scanning.clamav.read-timeout-milliseconds=30000
app.malware-scanning.clamav.maximum-file-size-bytes=${app.cv-extraction.maximum-file-size-bytes}
