services:
  parser-worker:
    build:
      context: '.'
      dockerfile: 'parser-worker/Dockerfile'
    profiles:
      - 'parser'
    environment:
      PARSER_WORKER_TOKEN: '${PARSER_WORKER_TOKEN:?Set PARSER_WORKER_TOKEN to at least 32 random characters}'
    ports:
      - '127.0.0.1:8081:8081'
    networks:
      - 'parser-isolated'
    mem_limit: '768m'
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - '/tmp:rw,noexec,nosuid,nodev,size=128m'
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - 'ALL'
    restart: unless-stopped
  clamav:
    image: 'clamav/clamav:1.4.6_base'
    profiles:
      - 'malware'
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - 'clamav-signatures:/var/lib/clamav'
    mem_limit: '4g'
    cpus: 1.0
    restart: unless-stopped
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
volumes:
  clamav-signatures:

networks:
  parser-isolated:
    internal: true
